<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Agent Core — Оркестратор</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrapper">
    <div class="tabs">
        <button id="tabTasksBtn" class="tab-btn active" onclick="switchTab('tasks')">Рабочее пространство</button>
        <button id="tabMemoryBtn" class="tab-btn" onclick="switchTab('memory')">База знаний (/memory/)</button>
    </div>

    <div id="tasksView" class="container">
        <div>
            <div class="card" style="margin-bottom: 20px;">
                <h3>Новая задача</h3>
                <textarea id="goalInput" placeholder="Опишите задачу..."></textarea>
                <input type="file" id="fileInput" multiple style="margin-top: 8px; font-size: 12px; color: #94a3b8; width: 100%;">
                <select id="modelSelect" style="width: 100%; margin-top: 10px; padding: 8px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 6px;"></select>
                <button onclick="createTask()">Запустить агента</button>
            </div>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">История задач</h3>
                    <button class="btn-clear" onclick="clearOldTasks()">Очистить</button>
                </div>
                <div id="taskList" style="max-height: 520px; overflow-y: auto;">Загрузка...</div>
            </div>
        </div>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px;">
                <div>
                    <h2 id="currentTitle" style="margin-bottom: 4px;">Выберите или создайте задачу</h2>
                    <div id="currentModelTag" style="font-size: 12px; color: #94a3b8;"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
                    <span id="globalStatus" class="badge">IDLE</span>
                    <button id="rerunBtn" class="btn-clear" style="display: none; background: #0284c7; color: #fff; padding: 6px 14px;" onclick="rerunCurrentTask()" title="Запустить снова с выбранной в списке моделью">Повторить</button>
                    <button id="stopBtn" class="btn-stop" style="display: none;" onclick="stopCurrentTask()">СТОП</button>
                </div>
            </div>
            <div id="finalResultBox"></div>
            <h3>Граф подзадач</h3>
            <div id="nodesContainer"></div>
            <h3>Лог событий (Live)</h3>
            <pre id="logsContainer">Ожидание...</pre>
        </div>
    </div>

    <div id="memoryView" class="mem-grid">
        <div class="card">
            <h3>Выученные навыки (Skills)</h3>
            <div id="skillsList">Загрузка...</div>
        </div>
        <div class="card">
            <h3>Журнал ошибок (Anti-patterns)</h3>
            <div id="antiList">Загрузка...</div>
        </div>
    </div>
</div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
